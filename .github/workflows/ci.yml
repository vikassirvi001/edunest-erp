name: CI

on:
  pull_request:
    branches: [main]
  # Added by VrittOS: without a push trigger the default branch never has
  # a workflow run, so nothing can tell whether main is green.
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
